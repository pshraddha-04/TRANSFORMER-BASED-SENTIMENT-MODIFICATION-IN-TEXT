name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          LIGHTWEIGHT_MODE: "1"
        run: pytest -q

      - name: Smoke backend endpoints
        env:
          LIGHTWEIGHT_MODE: "1"
        run: |
          python main.py > /tmp/sentiment-api.log 2>&1 &
          API_PID=$!
          trap "kill $API_PID" EXIT

          python - <<'PY'
          import time
          import requests

          for _ in range(60):
              try:
                  response = requests.get('http://127.0.0.1:8000/health', timeout=1)
                  if response.status_code == 200:
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('backend did not become ready')

          assert requests.get('http://127.0.0.1:8000/openapi.json', timeout=5).status_code == 200
          assert requests.post(
              'http://127.0.0.1:8000/predict',
              json={'text': 'I am worried about this delay', 'top_k': 3},
              timeout=5,
          ).status_code == 200
          assert requests.post(
              'http://127.0.0.1:8000/analyze-rewrite',
              json={
                  'text': 'I am upset with this service',
                  'target_tone': 'professional',
                  'user_instruction': 'keep it concise',
              },
              timeout=5,
          ).status_code == 200
          PY

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

